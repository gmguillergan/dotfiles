# Background Setup
background {
    monitor =
    path = /mnt/ISLAND/Files/Pictures/Wallpaper/TheWindGroup1.jpg
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.90
    brightness = 0.80
    vibrancy = 0.20
    vibrancy_darkness = 0.0
}

# -------------------------------
# TOP-LEFT: USER PFP & USERNAME
# -------------------------------

# User Avatar / Profile Picture
image {
    monitor =
    path = ~/.face.icon # Kung may pfp ka sa ~/.face o ilagay ang path ng image mo
    size = 70
    rounding = -1 # Ginagawang bilog
    border_size = 2
    border_color = rgba(143, 168, 139, 0.9)
    position = 30, -30
    halign = left
    valign = top
}

# Current Logged-in User
label {
    monitor =
    text = cmd[update:100000] echo "$USER"
    color = rgba(227, 237, 225, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Bold
    position = 115, -55
    halign = left
    valign = top
}

# -----------------------------------------------
# TOP-RIGHT: KOREAN DATE & TIME (년, 월, 일, 오전/오후)
# -----------------------------------------------

# Korean Date (YYYY년 MM월 DD일 Day)
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%Y년 %m월 %d일 (%a)' | sed -e 's/Mon/월/' -e 's/Tue/화/' -e 's/Wed/수/' -e 's/Thu/목/' -e 's/Fri/금/' -e 's/Sat/토/' -e 's/Sun/일/')"
    color = rgba(178, 200, 162, 0.95)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -35, -35
    halign = right
    valign = top
}

# Korean Time (오전/오후 HH시 MM분)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%p %I:%M' | sed -e 's/AM/오전/' -e 's/PM/오후/' | awk '{print $1, $2\"분\"}' | sed 's/:/시 /')"
    color = rgba(227, 237, 225, 1.0)
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold
    position = -35, -65
    halign = right
    valign = top
}

# -------------------------------
# CENTER: PASSWORD INPUT FIELD
# -------------------------------
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true

    outer_color = rgba(143, 168, 139, 0.85)
    inner_color = rgba(30, 39, 30, 0.65)
    font_color = rgba(227, 237, 225, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##b2c8a2">비밀번호 입력...</span>
    check_color = rgba(178, 200, 162, 1.0)
    fail_color = rgba(204, 102, 102, 1.0)

    position = 0, -20
    halign = center
    valign = center
}
